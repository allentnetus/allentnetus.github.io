{{- $url := .Permalink -}}
<div class="share-tools" data-share-url="{{ $url }}" data-share-title="{{ .Title }}">
  <span class="share-leading-icon" aria-hidden="true">
    <img class="share-share-icon" src="https://api.iconify.design/mdi:share-variant.svg?color=%230086c9" alt="">
  </span>
  <button class="share-native share-button" type="button" aria-label="系统分享" title="系统分享">
    <img class="share-share-icon" src="https://api.iconify.design/mdi:share-variant.svg?color=%230086c9" alt="">
  </button>
  <div class="share-desktop">
    <button class="share-button share-wechat" type="button" aria-label="微信扫码分享" title="微信扫码分享" aria-expanded="false">
      <img class="share-platform-icon" src="https://cdn.simpleicons.org/wechat/07C160" alt="">
    </button>
    <a class="share-button share-x" href="https://x.com/intent/tweet?text={{ .Title | urlquery }}&url={{ $url | urlquery }}" target="_blank" rel="noopener noreferrer" aria-label="分享到 X" title="分享到 X">
      <img class="share-platform-icon" src="https://cdn.simpleicons.org/x/000000" alt="">
    </a>
    <button class="share-button share-copy" type="button" aria-label="复制文章链接" title="复制文章链接">
      {{ partial "sprite" (dict "icon" "copy") }}
    </button>
  </div>
  <div class="share-qr" hidden role="dialog" aria-label="微信扫码分享">
    <button class="share-close" type="button" aria-label="关闭">×</button>
    <img alt="使用微信扫码分享本文" loading="lazy">
    <span>微信扫码分享</span>
  </div>
</div>

<style>
  .post_meta { display: flex; align-items: center; flex-wrap: wrap; gap: .35rem; }
  .post_meta .page_only { display: inline-flex; align-items: center; margin-left: auto; padding-left: 1.4rem; }
  .share-tools { position: relative; display: inline-flex; align-items: center; gap: .7rem; padding-left: 1.35rem; border-left: 1px solid rgba(0, 0, 0, .18); font-size: .9rem; }
  .share-tools .share-leading-icon { display: grid !important; place-items: center; width: 1.65rem; height: 1.65rem; margin: 0 !important; }
  .share-share-icon { display: block; width: 1.28rem; height: 1.28rem; justify-self: center; align-self: center; margin: 0 !important; }
  .share-desktop { display: inline-flex; gap: .6rem; align-items: center; }
  .share-button { display: grid; place-items: center; width: 2.35rem; height: 2.35rem; padding: 0; border: 1px solid #b7bdc1; border-radius: 999px; background: #fff; color: #4f565c; cursor: pointer; text-decoration: none; transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease, background-color .18s ease; }
  .share-button:hover, .share-button:focus-visible { background: #f7f9fa; box-shadow: 0 .2rem .6rem rgba(20, 39, 50, .12); transform: translateY(-1px); }
  .share-wechat:hover, .share-wechat:focus-visible { border-color: #07c160; background: #f1fbf4; }
  .share-x:hover, .share-x:focus-visible { border-color: #000; background: #f4f4f4; }
  .share-copy:hover, .share-copy:focus-visible { border-color: #0086c9; background: #eff8fc; color: #0086c9; }
  .share-platform-icon { display: block; width: 1.45rem; height: 1.45rem; object-fit: contain; justify-self: center; align-self: center; margin: 0 !important; }
  .share-copy .icon { display: block; width: 1.2rem; height: 1.2rem; fill: currentColor; }
  .share-button.is-copied { border-color: #07c160; color: #07c160; background: #f1fbf4; }
  .share-native { display: none; }
  .share-qr { position: absolute; z-index: 10; right: 0; top: calc(100% + .65rem); width: 13rem; padding: .8rem; background: #fff; border: 1px solid rgba(0, 0, 0, .14); border-radius: .5rem; box-shadow: 0 .45rem 1.2rem rgba(0, 0, 0, .16); text-align: center; }
  .share-qr img { display: block; width: 11rem; height: 11rem; margin: 0 auto .45rem; }
  .share-close { position: absolute; right: .35rem; top: .28rem; border: 0 !important; padding: .15rem .35rem !important; font-size: 1.2rem !important; }
  @media (max-width: 720px) { .post_meta .page_only { margin-left: 0; padding-left: 0; } .share-tools { padding-left: 0; border-left: 0; } .share-desktop, .share-leading-icon { display: none; } .share-native { display: grid; } .share-qr { right: auto; left: 0; } }
</style>

<script>
  document.addEventListener('click', function (event) {
    var tool = event.target.closest('.share-tools');
    if (!tool) return;
    var url = tool.dataset.shareUrl;
    var title = tool.dataset.shareTitle;
    var qr = tool.querySelector('.share-qr');
    var copy = function (button) {
      var done = function () {
        var originalLabel = button.getAttribute('aria-label');
        button.classList.add('is-copied');
        button.setAttribute('aria-label', '链接已复制');
        window.setTimeout(function () {
          button.classList.remove('is-copied');
          button.setAttribute('aria-label', originalLabel);
        }, 1800);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done);
      } else {
        window.prompt('复制文章链接', url);
      }
    };
    if (event.target.closest('.share-native')) {
      if (navigator.share) {
        navigator.share({ title: title, text: title, url: url }).catch(function () {});
      } else {
        copy(event.target.closest('.share-native'));
      }
    }
    if (event.target.closest('.share-copy')) copy(event.target.closest('.share-copy'));
    if (event.target.closest('.share-wechat')) {
      var image = qr.querySelector('img');
      if (!image.src) image.src = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(url);
      qr.hidden = !qr.hidden;
      event.target.closest('.share-wechat').setAttribute('aria-expanded', String(!qr.hidden));
    }
    if (event.target.closest('.share-close')) {
      qr.hidden = true;
      tool.querySelector('.share-wechat').setAttribute('aria-expanded', 'false');
    }
  });
</script>
